<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>はこにわ 動画ページ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EAF8F6}
a{color:#2B3A5A}a:hover{color:#1B2742}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hk-range{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer}
.hk-range::-webkit-slider-runnable-track{height:10px;border:2px solid #2B3A5A;border-radius:99px;background:linear-gradient(90deg,#F28AB2 0 31%,#FFFFFF 31% 100%)}
.hk-range::-moz-range-track{height:6px;border:2px solid #2B3A5A;border-radius:99px;background:linear-gradient(90deg,#F28AB2 0 31%,#FFFFFF 31% 100%)}
.hk-range::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:#FFFFFF;border:2.5px solid #2B3A5A;box-shadow:2px 2px 0 #2B3A5A}
.hk-range::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#FFFFFF;border:2.5px solid #2B3A5A;box-shadow:2px 2px 0 #2B3A5A}
.hk-vol::-webkit-slider-runnable-track{background:linear-gradient(90deg,#5AA9DE 0 70%,#FFFFFF 70% 100%)}
.hk-vol::-moz-range-track{background:linear-gradient(90deg,#5AA9DE 0 70%,#FFFFFF 70% 100%)}
.hk-card{transition:transform .15s ease, box-shadow .15s ease}
.hk-card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #2B3A5A}
.hk-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #2B3A5A}
.hk-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 #2B3A5A}
</style>
</helmet>
<div style="min-height: 100vh; background: #EAF8F6; color: #2B3A5A; font-family: 'Zen Maru Gothic', system-ui, sans-serif; font-weight: 500;">
<header style="border-bottom: 2.5px solid #2B3A5A; background: #FFFFFF;">
<div style="max-width: 1360px; margin: 0 auto; padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px;">
<a href="#top" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="17" width="26" height="17" rx="3" fill="#FFFFFF" stroke="#2B3A5A" stroke-width="2.5"></rect><path d="M4 19 L20 6 L36 19" fill="#F28AB2" stroke="#2B3A5A" stroke-width="2.5" stroke-linejoin="round"></path><rect x="16" y="24" width="8" height="10" rx="1.5" fill="#5AA9DE" stroke="#2B3A5A" stroke-width="2"></rect></svg>
<span style="font-size: 26px; font-weight: 900; letter-spacing: 0.04em;">はこにわ</span>
<span style="font-size: 12px; font-weight: 900; padding: 2px 8px; border: 2px solid #2B3A5A; border-radius: 99px; background: #F2D06B;">TV</span>
</a>
<form role="search" style="flex: 1 1 360px; display: flex; max-width: 560px; margin: 0;">
<label for="hk-q" class="sr">動画をさがす</label>
<input id="hk-q" type="search" placeholder="雨、電車、夜の音…" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 18px; border: 2.5px solid #2B3A5A; border-right: 0; border-radius: 99px 0 0 99px; font: inherit; font-size: 15px; color: #2B3A5A; background: #F6FBFF; outline-color: #5AA9DE;">
<button type="submit" aria-label="さがす" style="width: 56px; height: 44px; border: 2.5px solid #2B3A5A; border-radius: 0 99px 99px 0; background: #8FD6B8; color: #2B3A5A; cursor: pointer; display: grid; place-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 L21 21"></path></svg></button>
</form>
<div style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
<button type="button" class="hk-btn" style="height: 44px; padding: 0 20px; display: flex; align-items: center; gap: 8px; border: 2.5px solid #2B3A5A; border-radius: 99px; background: {{accent}}; color: #2B3A5A; font: inherit; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 3px 3px 0 #2B3A5A; transition: transform .12s, box-shadow .12s;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20 L3 11 L8 11 L8 20"></path><path d="M10 20 L10 6 L15 6 L15 20"></path><path d="M17 20 L17 13 L21 13 L21 20"></path><path d="M2 20 L22 20"></path></svg>WWT を適用</button>
</div>
</div>
<nav aria-label="カテゴリ" style="max-width: 1360px; margin: 0 auto; padding: 0 32px 14px; display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<a href="#top" style="{{c.style}}">{{c.label}}</a>
</sc-for>
</nav>
</header>

<main id="top" style="max-width: 1360px; margin: 0 auto; padding: 32px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start;">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">

<section aria-label="プレーヤー" style="background: #FFFFFF; border: 2.5px solid #2B3A5A; border-radius: 22px; box-shadow: 5px 5px 0 #2B3A5A; overflow: hidden;">
<div style="position: relative; aspect-ratio: 16 / 9; background: #BDEFF5; border-bottom: 2.5px solid #2B3A5A; overflow: hidden;">
<div style="position: absolute; left: 9%; top: 10%; width: 13%; aspect-ratio: 1; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 14px rgba(255,255,255,0.45);"></div>
<div style="position: absolute; left: 46%; top: 16%; width: 16%; height: 5%; border-radius: 99px; background: #FFFFFF;"></div>
<div style="position: absolute; left: 62%; top: 24%; width: 11%; height: 4%; border-radius: 99px; background: #FFFFFF;"></div>
<div style="position: absolute; bottom: 34%; left: 4%; width: 13%; height: 30%; background: #F6FBFF; border: 2.5px solid #2B3A5A; border-bottom: 0; border-radius: 6px 6px 0 0;"></div>
<div style="position: absolute; bottom: 34%; left: 18%; width: 9%; height: 42%; background: #5AA9DE; border: 2.5px solid #2B3A5A; border-bottom: 0; border-radius: 6px 6px 0 0;"></div>
<div style="position: absolute; bottom: 34%; left: 28%; width: 12%; height: 22%; background: #D46A72; border: 2.5px solid #2B3A5A; border-bottom: 0; border-radius: 6px 6px 0 0;"></div>
<div style="position: absolute; bottom: 34%; left: 66%; width: 10%; height: 36%; background: #8FD6B8; border: 2.5px solid #2B3A5A; border-bottom: 0; border-radius: 6px 6px 0 0;"></div>
<div style="position: absolute; bottom: 34%; left: 77%; width: 15%; height: 26%; background: #F6FBFF; border: 2.5px solid #2B3A5A; border-bottom: 0; border-radius: 6px 6px 0 0;"></div>
<div style="position: absolute; bottom: 34%; left: 56%; width: 1.2%; height: 46%; background: #2F6FA8; border-radius: 4px;"></div>
<div style="position: absolute; bottom: 72%; left: 56%; width: 9%; height: 7%; background: #2B3A5A; border-radius: 8px; display: flex; align-items: center; justify-content: space-evenly;"><span style="width: 22%; aspect-ratio: 1; border-radius: 50%; background: #F28AB2;"></span><span style="width: 22%; aspect-ratio: 1; border-radius: 50%; background: #4A5A78;"></span><span style="width: 22%; aspect-ratio: 1; border-radius: 50%; background: #4A5A78;"></span></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: #5AA9DE; border-top: 2.5px solid #2B3A5A;"></div>
<div style="position: absolute; left: 30%; right: 30%; bottom: 6%; height: 20%; background: repeating-linear-gradient(90deg, #F6FBFF 0 7%, transparent 7% 14%);"></div>
<div style="position: absolute; left: 3%; bottom: 7%; width: 18%; height: 4%; border-radius: 99px; background: #8FD6B8; border: 2px solid #2B3A5A;"></div>
<span style="position: absolute; left: 16px; top: 14px; font-size: 12px; font-weight: 900; padding: 4px 10px; border: 2px solid #2B3A5A; border-radius: 99px; background: #F2D06B;">ループ</span>
</div>
<div style="padding: 14px 18px; display: flex; align-items: center; gap: 14px;">
<button type="button" aria-label="一時停止" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid #2B3A5A; background: #2B3A5A; color: #FFFFFF; display: grid; place-items: center; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"></rect><rect x="14" y="5" width="4" height="14" rx="1.5"></rect></svg></button>
<span style="flex: none; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">3:42 / 12:00</span>
<label for="hk-seek" class="sr">再生位置</label>
<input id="hk-seek" class="hk-range" type="range" min="0" max="720" value="222" style="flex: 1; min-width: 80px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B3A5A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M4 9 L8 9 L13 5 L13 19 L8 15 L4 15 Z"></path><path d="M16.5 9.5 Q18.5 12 16.5 14.5"></path></svg>
<label for="hk-vol" class="sr">音量</label>
<input id="hk-vol" class="hk-range hk-vol" type="range" min="0" max="100" value="70" style="flex: none; width: 96px;">
<button type="button" aria-label="全画面" style="flex: none; width: 44px; height: 44px; border-radius: 12px; border: 2.5px solid #2B3A5A; background: #FFFFFF; color: #2B3A5A; display: grid; place-items: center; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9 L4 4 L9 4"></path><path d="M15 4 L20 4 L20 9"></path><path d="M20 15 L20 20 L15 20"></path><path d="M9 20 L4 20 L4 15"></path></svg></button>
</div>
</section>

<section aria-labelledby="hk-title" style="display: flex; flex-direction: column; gap: 14px;">
<h1 id="hk-title" style="margin: 0; font-size: 30px; font-weight: 900; line-height: 1.35;">雨あがりの交差点</h1>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;">
<div style="width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid #2B3A5A; background: #F2D06B; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B3A5A" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2 L12 4 M12 20 L12 22 M2 12 L4 12 M20 12 L22 12"></path></svg></div>
<div style="display: flex; flex-direction: column;"><span style="font-weight: 900;">ひるねの放送部</span><span style="font-size: 13px; color: #4A5A78;">ちいさな街の音と景色を、ゆっくり流します</span></div>
<div style="margin-left: auto; display: flex; gap: 10px;">
<button type="button" class="hk-btn" style="height: 44px; padding: 0 18px; border: 2.5px solid #2B3A5A; border-radius: 99px; background: #FFFFFF; color: #2B3A5A; font: inherit; font-weight: 900; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 3px 3px 0 #2B3A5A; transition: transform .12s, box-shadow .12s;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#F28AB2" stroke="#2B3A5A" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20 C5 15 3 11.5 3 8.5 C3 6 5 4 7.5 4 C9.3 4 11 5 12 6.6 C13 5 14.7 4 16.5 4 C19 4 21 6 21 8.5 C21 11.5 19 15 12 20 Z"></path></svg>すき 2,184</button>
<button type="button" class="hk-btn" style="height: 44px; padding: 0 18px; border: 2.5px solid #2B3A5A; border-radius: 99px; background: #2B3A5A; color: #FFFFFF; font: inherit; font-weight: 900; cursor: pointer; box-shadow: 3px 3px 0 #2B3A5A; transition: transform .12s, box-shadow .12s;">おきにいり</button>
</div>
</div>
<div style="background: #FFFFFF; border: 2.5px solid #2B3A5A; border-radius: 18px; padding: 16px 20px; font-size: 15px; line-height: 1.8;">
<div style="font-size: 13px; font-weight: 900; color: #2F6FA8; margin-bottom: 4px;">1.2万回 · 3日前</div>
雨がやんだ直後の、静かな交差点。信号が三回かわるあいだだけ録った音と、すこしだけ動く雲。作業のおともに、ループでどうぞ。
</div>
</section>

<section aria-labelledby="hk-cm" style="display: flex; flex-direction: column; gap: 14px;">
<h2 id="hk-cm" style="margin: 0; font-size: 20px; font-weight: 900;">コメント <span style="font-size: 15px; color: #4A5A78;">48</span></h2>
<sc-for list="{{comments}}" as="m" hint-placeholder-count="4">
<article style="display: flex; gap: 14px; align-items: flex-start;">
<div aria-hidden="true" style="{{m.avatar}}"></div>
<div style="flex: 1; min-width: 0; background: #FFFFFF; border: 2.5px solid #2B3A5A; border-radius: 4px 18px 18px 18px; padding: 12px 16px;">
<div style="display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;"><span style="font-weight: 900;">{{m.name}}</span><span style="font-size: 12px; color: #4A5A78;">{{m.when}}</span></div>
<p style="margin: 4px 0 0; font-size: 15px; line-height: 1.7;">{{m.text}}</p>
</div>
</article>
</sc-for>
</section>
</div>

<aside aria-labelledby="hk-next" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
<h2 id="hk-next" style="margin: 0; font-size: 20px; font-weight: 900;">つぎに見る</h2>
<sc-for list="{{videos}}" as="v" hint-placeholder-count="6">
<a href="#top" class="hk-card" style="display: flex; gap: 12px; align-items: flex-start; padding: 10px; background: #FFFFFF; border: 2.5px solid #2B3A5A; border-radius: 16px; box-shadow: 4px 4px 0 #2B3A5A; text-decoration: none; color: #2B3A5A;">
<div style="position: relative; flex: none; width: 46%; aspect-ratio: 16 / 9; border-radius: 10px; border: 2px solid #2B3A5A; overflow: hidden; {{v.sky}}">
<div style="{{v.sun}}"></div>
<div style="{{v.b1}}"></div>
<div style="{{v.b2}}"></div>
<div style="{{v.b3}}"></div>
<div style="{{v.ground}}"></div>
<span style="position: absolute; right: 6px; bottom: 6px; font-size: 11px; font-weight: 900; padding: 1px 7px; border-radius: 99px; background: #2B3A5A; color: #FFFFFF;">{{v.dur}}</span>
</div>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-top: 2px;">
<span style="font-size: 15px; font-weight: 900; line-height: 1.4;">{{v.title}}</span>
<span style="font-size: 12px; color: #4A5A78;">{{v.ch}}</span>
<span style="font-size: 12px; color: #4A5A78;">{{v.meta}}</span>
</div>
</a>
</sc-for>
</aside>
</main>

<footer style="border-top: 2.5px solid #2B3A5A; background: #FFFFFF;">
<div style="max-width: 1360px; margin: 0 auto; padding: 18px 32px; display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; color: #4A5A78;">
<span style="font-weight: 900; color: #2B3A5A;">はこにわ</span>
<span>架空の動画サイトです（WWT Playground）</span>
<a href="#top">作品について</a>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F28AB2","options":["#F28AB2","#F2D06B","#8FD6B8","#5AA9DE"]},"$preview":{"width":1440,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    var ink = '#2B3A5A';
    function scene(sky, sun, sunX, sunY, ground, bs) {
      var out = {
        sky: 'background:' + sky + ';',
        sun: 'position:absolute;left:' + sunX + '%;top:' + sunY + '%;width:18%;aspect-ratio:1;border-radius:50%;background:' + sun + ';',
        ground: 'position:absolute;left:0;right:0;bottom:0;height:24%;background:' + ground + ';border-top:2px solid ' + ink + ';'
      };
      ['b1', 'b2', 'b3'].forEach(function (k, i) {
        var b = bs[i];
        out[k] = 'position:absolute;bottom:24%;left:' + b[0] + '%;width:' + b[1] + '%;height:' + b[2] + '%;background:' + b[3] + ';border:2px solid ' + ink + ';border-bottom:0;border-radius:4px 4px 0 0;';
      });
      return out;
    }
    var list = [
      ['夜のコインランドリー', 'ひるねの放送部', '8.4千回 · 1週間前', '8:00', scene('#8C9BD6', '#F6FBFF', 70, 12, '#2F6FA8', [[8, 26, 44, '#F2D06B'], [38, 16, 30, '#F6FBFF'], [58, 14, 52, '#D46A72']])],
      ['屋上の風と洗濯もの', 'そよかぜ録音室', '2.1万回 · 2週間前', '5:12', scene('#BDEFF5', '#FFFFFF', 12, 10, '#8FD6B8', [[10, 30, 30, '#F6FBFF'], [46, 12, 56, '#5AA9DE'], [64, 26, 40, '#F28AB2']])],
      ['午後四時の電車', 'まどぎわ鉄道', '3.3万回 · 1か月前', '9:30', scene('#FBD9C9', '#FFF1C9', 72, 14, '#5AA9DE', [[6, 18, 36, '#F6FBFF'], [28, 40, 22, '#D46A72'], [74, 16, 46, '#8FD6B8']])],
      ['まわる観覧車', 'ひるねの放送部', '6.7千回 · 4日前', '4:44', scene('#D9F0E6', '#FFFFFF', 44, 8, '#2E9E8C', [[12, 14, 48, '#5AA9DE'], [32, 22, 30, '#F2D06B'], [62, 24, 40, '#F6FBFF']])],
      ['放課後のチャイム', 'がっこうの音', '1.8万回 · 3週間前', '3:20', scene('#FFF1C9', '#F28AB2', 16, 12, '#8FD6B8', [[30, 40, 46, '#F6FBFF'], [8, 16, 26, '#5AA9DE'], [76, 16, 34, '#D46A72']])],
      ['雨の音だけ 30分', 'そよかぜ録音室', '9.9万回 · 2か月前', '30:00', scene('#CFE3F2', '#E8FBFF', 60, 6, '#5AA9DE', [[10, 20, 34, '#F6FBFF'], [34, 14, 50, '#8C9BD6'], [56, 30, 26, '#8FD6B8']])]
    ];
    var videos = list.map(function (r) {
      var s = r[4];
      return { title: r[0], ch: r[1], meta: r[2], dur: r[3], sky: s.sky, sun: s.sun, b1: s.b1, b2: s.b2, b3: s.b3, ground: s.ground };
    });
    function av(c) { return 'flex:none;width:44px;height:44px;border-radius:50%;border:2.5px solid ' + ink + ';background:' + c + ';box-shadow:2px 2px 0 ' + ink + ';'; }
    var comments = [
      { name: 'ねこじた', when: '2日前', text: '信号の音で毎回ちょっと顔を上げてしまう。', avatar: av('#8FD6B8') },
      { name: 'ふゆのまど', when: '2日前', text: '1:58 の雲がすっと横切るところが好きです。', avatar: av('#F2D06B') },
      { name: 'よるのばす', when: '1日前', text: '課題のあいだずっと流してました。', avatar: av('#F28AB2') },
      { name: 'しろいかさ', when: '5時間前', text: '雨あがりの匂いまでしてきそう。', avatar: av('#5AA9DE') }
    ];
    var chipNames = ['ぜんぶ', '雨', '夜', '電車', '屋上', '音だけ'];
    var chips = chipNames.map(function (n, i) {
      var on = i === 0;
      return { label: n, style: 'display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border:2px solid ' + ink + ';border-radius:99px;font-size:14px;font-weight:900;text-decoration:none;color:' + ink + ';background:' + (on ? '#F2D06B' : '#FFFFFF') + ';' };
    });
    return { accent: this.props.accent ?? '#F28AB2', videos: videos, comments: comments, chips: chips };
  }
}
</script>
</body>
</html>
