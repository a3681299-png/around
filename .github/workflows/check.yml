name: Theme checks

on:
  push:
    branches: [
        feat/heisei-silver-blue,
        feat/heisei-silver-shell,
        fix/youtube-silver-native-surfaces,
        codex/extension-completion,
        codex/creator-editor-spike,
        # The next chunk's branch while Codex verifies the previous one (AGENTS.md).
        'codex/chunk*',
      ]
  pull_request:
  # The full e2e suite on demand (Actions → Theme checks → Run workflow), e.g. before a chunk is
  # taken into the working branch. Every push runs typecheck, lint and unit only (2026-11-06,
  # 翔太の決定; AGENTS.md「テストの段階分け」): the full e2e runs here when started by hand and on
  # pushes to codex/creator-editor-spike that change more than docs, and Codex runs it on Windows
  # at the end of every chunk.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-unit-results
          path: .work/test-results/unit/
          include-hidden-files: true
          retention-days: 7
  # On a push to the working branch only: whether it changes anything besides docs (Markdown and
  # docs/). A docs-only push (reports, plans) runs no e2e.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/creator-editor-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # An unknown previous commit (a new branch, a forced push): treat it as a code change.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo code=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qvE '^docs/|\.md$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi
  e2e:
    needs: changes
    # Started by hand, or a push to the working branch that changes code (see `changes`).
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    # The serial suite takes ~23m on one runner. Each shard is its own machine, so
    # `workers: 1` (native windows and benchmarks must not share a host) still holds.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Chromium/system dependencies can take 7m before the serial browser suite starts.
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.work/browsers
      WW_BUILD_OUT: .work/test-dist
      WW_TEST_EXTENSION_PATH: .work/test-dist
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --no-shell
      # Native toolbar action / shortcut tests must go through Chrome's accelerators.
      - run: sudo apt-get install -y xdotool
      - run: npm run build
      # Fail early if the native toolbar/command window cannot receive input.
      - if: matrix.shard == 1
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e -- tests/editor-entry.spec.ts tests/side-panel.spec.ts --grep "OFF opens|ON action|hand off unsaved|timeline keeps layer controls" --output=.work/native-entry-results
      # Native Chrome Side Panel tests need a real window and display server.
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-e2e-results-${{ matrix.shard }}
          path: |
            .work/test-results/e2e/
            .work/native-entry-results/
            .work/live-results/
          include-hidden-files: true
          retention-days: 7
