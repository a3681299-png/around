name: Theme checks

on:
  push:
    branches: [feat/heisei-silver-blue, feat/heisei-silver-shell, fix/youtube-silver-native-surfaces]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.work/browsers
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --no-shell
      - run: npm run check
      - name: Optional public YouTube inspection
        if: github.ref_name == 'fix/youtube-silver-native-surfaces'
        continue-on-error: true
        run: WW_LIVE_YOUTUBE=1 npm test -- tests/live-youtube.spec.ts --output=.work/live-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-test-results
          path: |
            .work/test-results/
            .work/live-results/
          include-hidden-files: true
          retention-days: 7
