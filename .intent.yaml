project:
  name: Around
  milestone: 2027年1月までに、デスクトップ版 YouTube 上で動作する単一の3D世界を高品質なデモとして完成させる。
  core_value: >
    デスクトップ版 YouTube の操作感をそのまま維持しながら、
    Web の背後に本物の 3D 空間（海・積乱雲・回遊魚・キャラクター）を広げ、
    スクロールやカード UI と世界が連動する Chrome 拡張機能。
  target_experience:
    - '通常時（正面視点）: 巨大な積乱雲・青い海・穏やかな波がカードの隙間から見え、水面近くでキャラが自由に行動する。'
    - 'スクロール中（カメラ移動）: ページのスクロールに連動して 3D カメラが上昇する。DOM は傾けず操作感も変えない。'
    - '俯瞰時（俯瞰視点）: 水中を巨大な回遊魚が泳ぎ、キャラはカードを足場にして飛び移る。魚が通ると波が広がりカードがわずかに揺れ、キャラがこちらに気づいて手を振ることもある。'

principles:
  品質保証: 正常系に加え、異常系（YouTube の DOM 変化・リサイズ・SPA 遷移・高速スクロール等）と境界値で壊れないことを確かめる。
  定量的評価: 描画やページ上の処理を変えたら、FPS、描画時間、メモリ使用量、起動・読込時間を同じ条件で変更前後に記録する。
  設計の説明責任: 後から変えにくい判断は、採用理由、捨てた案、受け入れた制約を decisions に残す。
  保守性: モジュールの責務を守り、既存テストと YouTube 本体の操作感を壊さずに改善できる構造を保つ。
  過剰設計の防止: 1月デモの完成形を満たす最小の変更を選ぶ。汎用プラットフォーム化や不要な抽象化は行わず、分割を増やすなら何が改善するかを示す。

non_goals:
  - 'YouTube の操作感を損なう過度な DOM 変形（ページ全体の傾斜、クリック領域のズレ、検索・再生の阻害）。'
  - 'YouTube の埋め込みプレイヤーとライブチャット専用ページへの適用。'
  - '1月デモ完了前の汎用テーマ投稿・複数作品対応・新規マイグレーション機構の拡張。'
  - '私用 VRM や Mixamo 素材などライセンス上配布できないアセットのリポジトリ収録・同梱。'

boundaries:
  src/content/: 拡張機能の起動・設定反映を受け取り、ページの制御を開始する。
  src/sites/: YouTube 固有のセレクター、カード位置計測、DOM 監視、SPA 遷移を扱い、他層に共通の座標・状態を渡す。
  src/design/: 既存データ形式の枠組み（1月デモに向けて新規の汎用拡張・版管理追加は行わない）。
  src/world/: DOM や Chrome API に依存せず、カメラ移動、キャラの行動・足場判定、回遊魚や波紋の状態を計算する。
  src/host/: ページ入力・カード揺れ等の最小限の DOM 演出と 3D 描画をつなぎ、YouTube 本来の操作部品を守る。
  src/renderers/: Three.js / VRM / 水面・積乱雲・回遊魚などの 3D 空間を画面に描く。

decisions:
  - id: 'DEC-001'
    decision: 'スクロール連動の視点変化は 3D カメラ移動のみで行い、YouTube の DOM 自体は傾けず、DOM 演出はカードの微細な揺れ等に限定する。'
    why: 'Web ページとしての普段の操作感・視認性を壊さずに、背後に本物の 3D 空間がある没入感を両立するため。'
    rejected_alternatives:
      - 'CSS 3D transform で YouTube の DOM 全体を傾ける方式（操作性・文字の視認性・クリック判定が崩れやすい）'
    accepted_tradeoff: 'DOM と 3D 空間のパースを物理的に完全一致させることは諦め、視覚的な自然さで調整する。'
  - id: 'DEC-002'
    decision: 'カメラ・キャラ・回遊魚・足場計算を DOM / Chrome API 非依存の src/world/ に分離し、YouTube 固有の DOM 監視は src/sites/ に隔離する。'
    why: 'YouTube の頻繁な DOM 仕様変更の影響を最小範囲に閉じ込め、状態ロジックを単体テストで高速かつ確実に検証できるようにするため。'
    rejected_alternatives:
      - 'Content Script 内で DOM 座標取得と 3D 更新を一体で書く構成（壊れやすくテスト困難）'
    accepted_tradeoff: 'DOM 座標から 3D 空間座標へ橋渡しする変換層の維持コストが発生する。'
  - id: 'DEC-003'
    decision: '2027年1月のデモ完成までは複数テーマ対応の汎用プラットフォーム化を凍結し、単一の3D世界（海・積乱雲・回遊魚・キャラ）の体験品質に集中する。'
    why: '限られた期間で技術力と表現力を証明するには、薄い汎用基盤より1つの圧倒的な完成形を作る方が価値が高いため。'
    rejected_alternatives:
      - '複数作者が作品を投稿・切替できる汎用テーマエンジンを先に作り込む案（スコープ肥大化で肝心の表現品質が落ちる）'
    accepted_tradeoff: 'デモ時点では他の世界観への切替や外部作品インポート機能は持たない。'

performance_targets:
  measurement_condition: 'デスクトップ版 YouTube ホーム／動画ページ（スクロール操作・通常再生中）で Chrome DevTools にて計測'
  fps: '60fps 維持（最低 55fps 以上、スクロールや動画再生のカクつきを起こさない）'
  render_time_ms_per_frame: '8ms 以下（YouTube 本体の描画・動画デコードと競合しない予算に収める）'
  memory_mib: '拡張追加分のメモリ増加を一定上限内に抑え、連続スクロール・SPA 遷移で単調増加（リーク）しないこと'
  startup_load_time_ms: 'ページ遷移から初期表示まで YouTube の操作をブロックしない（目安 500ms 以内、重い 3D/VRM アセットは非同期読込）'
