<!-- @dsCard group="Navigation" height=320 subtitle="vertical in Studio, horizontal in the side panel; click a tool" -->
<div
  class="ww"
  style="
    background: var(--ground);
    padding: 20px;
    min-height: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    align-items: flex-start;
  "
  ><nav class="around-rail" aria-label="道具" id="rail-a"
    ><button class="around-icon-btn" aria-pressed="true" aria-label="選択"
      ><svg viewBox="0 0 16 16"><path d="M3 2v11l3-3 2.5 4.5 2-1L8 9h4.5z" /></svg></button
    ><button class="around-icon-btn" aria-pressed="false" aria-label="移動"
      ><svg viewBox="0 0 16 16">
        <path d="M8 1.5v13M1.5 8h13M6 3.5l2-2 2 2M6 12.5l2 2 2-2M3.5 6l-2 2 2 2M12.5 6l2 2-2 2" /></svg></button
    ><hr /><button class="around-icon-btn" aria-pressed="false" aria-label="素材"
      ><svg viewBox="0 0 16 16">
        <rect x="2.5" y="3" width="11" height="10" rx="1" />
        <path d="M2.5 11l3.5-3.5 3 3 2-2 2.5 2.5" />
        <circle cx="10.5" cy="6" r="1" /></svg></button
    ><button class="around-icon-btn" aria-pressed="false" aria-label="UIを着せ替え"
      ><svg viewBox="0 0 16 16">
        <path d="M5.5 2L2 4.5 3.5 7.5 5 6.5V14h6V6.5l1.5 1L14 4.5 10.5 2a2.5 2.5 0 0 1-5 0z" /></svg></button
    ><button class="around-icon-btn" aria-pressed="false" aria-label="光"
      ><svg viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="3" />
        <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15" /></svg></button
    ><button class="around-icon-btn" aria-pressed="false" aria-label="タイムシート"
      ><svg viewBox="0 0 16 16">
        <rect x="1.5" y="2.5" width="13" height="11" />
        <path d="M1.5 6h13M6 6v7.5" /></svg></button
  ></nav>
  <nav class="around-rail around-rail--row" aria-label="道具" id="rail-b"
    ><button class="around-icon-btn" aria-pressed="false" aria-label="選択"
      ><svg viewBox="0 0 16 16"><path d="M3 2v11l3-3 2.5 4.5 2-1L8 9h4.5z" /></svg></button
    ><button class="around-icon-btn" aria-pressed="false" aria-label="移動"
      ><svg viewBox="0 0 16 16">
        <path d="M8 1.5v13M1.5 8h13M6 3.5l2-2 2 2M6 12.5l2 2 2-2M3.5 6l-2 2 2 2M12.5 6l2 2-2 2" /></svg></button
    ><hr /><button class="around-icon-btn" aria-pressed="true" aria-label="UIを着せ替え"
      ><svg viewBox="0 0 16 16">
        <path d="M5.5 2L2 4.5 3.5 7.5 5 6.5V14h6V6.5l1.5 1L14 4.5 10.5 2a2.5 2.5 0 0 1-5 0z" /></svg></button
    ><button class="around-icon-btn" aria-pressed="false" aria-label="タイムシート"
      ><svg viewBox="0 0 16 16">
        <rect x="1.5" y="2.5" width="13" height="11" />
        <path d="M1.5 6h13M6 6v7.5" /></svg></button></nav
></div>
<script>
  ['rail-a', 'rail-b'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function (e) {
      var b = e.target.closest('.around-icon-btn');
      if (!b) return;
      this.querySelectorAll('.around-icon-btn').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
    });
  });
</script>
