<!-- @dsCard group="Feedback" height=420 subtitle="layers, empty: the golden construction, then the words" -->
<div class="ww" style="background:var(--surface);min-height:100%;display:flex;justify-content:center">
<div class="ww-empty" style="width:420px;box-sizing:border-box">
<svg class="ww-empty__drawing" viewBox="0 0 236 152" id="draw" role="img" aria-label="黄金長方形の作図">
<g transform="translate(8 8)" id="g">
<line class="ww-rule ww-draw" pathLength="1" x1="-6" y1="136" x2="226" y2="136"></line>
<rect class="ww-rule ww-draw" pathLength="1" x="0" y="0" width="136" height="136" style="--ww-delay:166ms"></rect>
<line class="ww-rule ww-draw" pathLength="1" x1="68" y1="136" x2="136" y2="0" style="--ww-delay:333ms"></line>
<line class="ww-rule ww-draw" pathLength="1" x1="136" y1="-4" x2="136" y2="140" style="--ww-delay:500ms"></line>
<line class="ww-rule ww-draw" pathLength="1" x1="132" y1="84" x2="224" y2="84" style="--ww-delay:583ms"></line>
<line class="ww-rule ww-draw" pathLength="1" x1="168" y1="80" x2="168" y2="140" style="--ww-delay:666ms"></line>
<line class="ww-rule ww-draw" pathLength="1" x1="132" y1="104" x2="172" y2="104" style="--ww-delay:750ms"></line>
</g>
</svg>
<h2 class="ww-empty__title ww-appear" style="--ww-delay:1500ms">まだレイヤーがありません</h2>
<p class="ww-empty__text ww-appear" style="--ww-delay:1583ms">画像や動画をここにドロップするか、ファイルを選んで、最初のレイヤーを置きます。</p>
<div class="ww-empty__actions ww-appear" style="--ww-delay:1750ms"><button class="ww-btn ww-btn--primary">ファイルを選ぶ</button><button class="ww-btn">見本から始める</button></div>
</div></div>
<script>
(function () {
  var W = window.WWTStudio, g = document.getElementById('g');
  // The compass arc from the half-way point of the base, then the rectangle, then the spiral.
  W.drawPen(g, W.arc(68, 136, 152, Math.atan2(-136, 68), 0), { width: 1.8, color: 'var(--pen-bone)', delay: 10 });
  W.drawPen(g, W.line(-4, 0, 224, 0), { width: 3.4, color: 'var(--ink)', delay: 13 });
  W.drawPen(g, W.line(220, -4, 220, 140), { width: 3.4, color: 'var(--ink)', delay: 14 });
  W.drawPen(g, W.line(224, 136, -4, 136), { width: 3.4, color: 'var(--ink)', delay: 15 });
  W.drawPen(g, W.line(0, 140, 0, -4), { width: 3.4, color: 'var(--ink)', delay: 16 });
  W.drawPen(g, W.goldenSpiral(0, 0, [136, 84, 52, 32, 20, 12]), { width: 3.4, color: 'var(--cobalt)', delay: 17, frames: 8 });
})();
</script>
